<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>pdf page viewer (audit)</title>
  <style>
    body { margin: 0; background: #555; font: 12px monospace; color: #eee; }
    .pg { margin: 12px auto; width: max-content; }
    .pg p { margin: 0 0 4px; }
    canvas { display: block; background: #fff; box-shadow: 0 2px 8px #0008; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="out"></div>
  <script>
    /*
     * Renders chosen pages of a PDF so they can be screenshotted.
     * /_audit/pdfview.html?file=/downloads/ziyarat-guide-ur.pdf&pages=1,3&scale=1.2
     * The worker is fetched and run from a same-origin blob (a cross-origin
     * worker URL is not allowed).
     */
    (async () => {
      const qs = new URLSearchParams(location.search);
      const file = qs.get('file');
      const pages = (qs.get('pages') || '1').split(',').map(Number);
      const scale = +(qs.get('scale') || 1.2);
      const worker = await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([worker], { type: 'text/javascript' }));
      const doc = await pdfjsLib.getDocument(file).promise;
      document.title = `${file} · ${doc.numPages} pages`;
      for (const n of pages) {
        const page = await doc.getPage(n);
        const vp = page.getViewport({ scale });
        const wrap = document.createElement('div');
        wrap.className = 'pg';
        wrap.id = `p${n}`;
        wrap.innerHTML = `<p>${file} — page ${n} / ${doc.numPages}</p>`;
        const c = document.createElement('canvas');
        c.width = vp.width;
        c.height = vp.height;
        wrap.appendChild(c);
        document.getElementById('out').appendChild(wrap);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
      document.body.dataset.done = '1';
    })().catch((e) => { document.body.dataset.done = 'error'; document.body.insertAdjacentText('beforeend', String(e)); });
  </script>
</body>
</html>
